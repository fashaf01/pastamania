<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PastaMania Club</title>
    <meta name="description" content="PastaMania Sri Lanka – pasta and pizza at Havelock City Mall, Alfred House Gardens and One Galle Face. Menu, offers, branches and events." />
    <meta name="theme-color" content="#9e2022" />
    <!-- Stop iOS Safari turning numbers and dates into links: it rewrites text the app manages. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PastaMania" />
    <meta property="og:title" content="PastaMania Club" />
    <meta property="og:description" content="Eat pasta, earn free pasta. Join free and your first Garlic Bread is on us." />
    <meta property="og:image" content="/images/brand/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Fonts are served from this site (public/fonts), not Google: nothing blocks the first paint, and the two
         the first screen needs (Archivo for text, Ultra for headlines) are preloaded so the text never reflows
         when they arrive. Latin letters only; anything else falls back to the phone's own font. -->
    <link rel="preload" href="/fonts/archivo-var-v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ultra-v1.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Archivo'; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%; font-display: swap;
        src: url(/fonts/archivo-var-v1.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Ultra'; font-style: normal; font-weight: 400; font-display: swap;
        src: url(/fonts/ultra-v1.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap;
        src: url(/fonts/plexmono-500-v1.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; font-display: swap;
        src: url(/fonts/plexmono-600-v1.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    </style>
    <script>
      // Apply the saved light/dark choice before the first paint so the app never flashes the wrong theme.
      // "boot" switches the colour fades off for the very first screen (removed again in main.jsx), so the
      // page doesn't fade from cream to wine while it loads.
      ;(function () {
        document.documentElement.classList.add('boot')
        var darkMode = false // keep in step with DARK_MODE in src/lib/theme.jsx (light only for now)
        var mode
        try { mode = localStorage.getItem('pm.theme') } catch (e) {}
        var dark = darkMode && (mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
